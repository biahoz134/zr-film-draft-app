<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZR Film Draft - AI Drama Studio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for in-browser JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [activeTab, setActiveTab] = React.useState('studio');
            const [episodeCount, setEpisodeCount] = React.useState(50);
            const [duration, setDuration] = React.useState(2);
            const [isAdminMode, setIsAdminMode] = React.useState(false);
            const [adminPassword, setAdminPassword] = React.useState('');
            const [payoutMethod, setPayoutMethod] = React.useState('SadaPay');

            const handleVerifyPassword = () => {
                if (adminPassword === 'ZR_Empire_9988#') {
                    setIsAdminMode(true);
                    alert('Admin Access Granted!');
                } else {
                    alert('Incorrect Password!');
                }
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Top Header */}
                    <header className="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center">
                        <div className="flex items-center space-x-3">
                            <span className="text-2xl font-black bg-gradient-to-r from-purple-500 to-indigo-500 bg-clip-text text-transparent">ZR Film Draft</span>
                            <span className="text-xs bg-purple-900/50 text-purple-300 border border-purple-700 px-2 py-0.5 rounded-full">AI Studio</span>
                        </div>
                        <div className="flex items-center space-x-4">
                            <button 
                                onClick={() => setActiveTab('studio')}
                                className={`px-4 py-2 rounded-lg font-medium text-sm transition ${activeTab === 'studio' ? 'bg-purple-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
                            >
                                Studio
                            </button>
                            <button 
                                onClick={() => setActiveTab('payouts')}
                                className={`px-4 py-2 rounded-lg font-medium text-sm transition ${activeTab === 'payouts' ? 'bg-purple-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
                            >
                                Payouts & Banks
                            </button>
                            <button 
                                onClick={() => setActiveTab('admin')}
                                className={`px-4 py-2 rounded-lg font-medium text-sm transition ${activeTab === 'admin' ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
                            >
                                Owner Access
                            </button>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="flex-1 p-6 max-w-7xl mx-auto w-full">
                        {activeTab === 'studio' && (
                            <div className="space-y-6">
                                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                                    <h2 className="text-xl font-bold mb-4 text-purple-400">🎬 AI Drama & Short-Clip Studio</h2>
                                    <p className="text-slate-400 text-sm mb-6">Customize your episodes, configure your dark fantasy storylines, and generate production drafts instantly.</p>
                                    
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                                            <label className="block text-sm font-medium mb-2">Total Episodes: <span className="text-purple-400 font-bold">{episodeCount}</span></label>
                                            <input 
                                                type="range" 
                                                min="1" 
                                                max="200" 
                                                value={episodeCount} 
                                                onChange={(e) => setEpisodeCount(e.target.value)}
                                                className="w-full accent-purple-500 cursor-pointer"
                                            />
                                            <div className="flex justify-between text-xs text-slate-500 mt-1">
                                                <span>1 Ep</span>
                                                <span>100 Ep</span>
                                                <span>200 Ep</span>
                                            </div>
                                        </div>

                                        <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                                            <label className="block text-sm font-medium mb-2">Episode Duration: <span className="text-purple-400 font-bold">{duration} Minutes</span></label>
                                            <input 
                                                type="range" 
                                                min="1" 
                                                max="10" 
                                                value={duration} 
                                                onChange={(e) => setDuration(e.target.value)}
                                                className="w-full accent-purple-500 cursor-pointer"
                                            />
                                            <div className="flex justify-between text-xs text-slate-500 mt-1">
                                                <span>1 Min</span>
                                                <span>5 Min</span>
                                                <span>10 Min</span>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="mt-6 flex justify-end">
                                        <button 
                                            onClick={() => alert('AI Generation Script Initialized successfully!')}
                                            className="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-semibold px-6 py-3 rounded-xl shadow-lg transition"
                                        >
                                            Generate AI Script Drafts
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'payouts' && (
                            <div className="space-y-6">
                                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                                    <h2 className="text-xl font-bold mb-4 text-purple-400">💳 Direct Payout & Wallet Configuration</h2>
                                    <p className="text-slate-400 text-sm mb-6">Manage your local Pakistani digital wallets and international payout channels.</p>
                                    
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                                        {['SadaPay', 'JazzCash / EasyPaisa', 'Bank Alfalah / Payoneer'].map((method) => (
                                            <div 
                                                key={method}
                                                onClick={() => setPayoutMethod(method)}
                                                className={`p-4 rounded-xl border cursor-pointer transition ${payoutMethod === method ? 'bg-purple-950/40 border-purple-500 text-purple-300' : 'bg-slate-950 border-slate-800 text-slate-400 hover:border-slate-700'}`}
                                            >
                                                <div className="font-semibold">{method}</div>
                                                <div className="text-xs mt-1 opacity-75">Configured & Active</div>
                                            </div>
                                        ))}
                                    </div>

                                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-4">
                                        <div>
                                            <label className="block text-sm font-medium mb-1">Selected Payout Method</label>
                                            <input type="text" readOnly value={payoutMethod} className="w-full bg-slate-900 border border-slate-800 rounded-lg px-4 py-2 text-slate-300" />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium mb-1">Account Number / IBAN</label>
                                            <input type="text" placeholder="Enter your account or IBAN number" className="w-full bg-slate-900 border border-slate-800 rounded-lg px-4 py-2 text-slate-100 focus:outline-none focus:border-purple-500" />
                                        </div>
                                        <button onClick={() => alert('Payout details saved successfully!')} className="bg-purple-600 hover:bg-purple-500 text-white font-medium px-5 py-2 rounded-lg transition">
                                            Save Payout Settings
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'admin' && (
                            <div className="max-w-md mx-auto space-y-6">
                                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl text-center">
                                    <h2 className="text-xl font-bold mb-2 text-indigo-400">🔐 Owner Access Control</h2>
                                    <p className="text-slate-400 text-sm mb-6">Enter your master admin password to access restricted studio controls.</p>
                                    
                                    {!isAdminMode ? (
                                        <div className="space-y-4">
                                            <input 
                                                type="password" 
                                                placeholder="Enter Master Password" 
                                                value={adminPassword}
                                                onChange={(e) => setAdminPassword(e.target.value)}
                                                className="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-center text-slate-100 focus:outline-none focus:border-indigo-500"
                                            />
                                            <button 
                                                onClick={handleVerifyPassword}
                                                className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-lg transition shadow-lg"
                                            >
                                                Verify & Unlock
                                            </button>
                                        </div>
                                    ) : (
                                        <div className="space-y-4">
                                            <div className="bg-indigo-950/50 border border-indigo-700 text-indigo-300 p-4 rounded-xl font-medium">
                                                ✅ Owner Mode Unlocked Successfully!
                                            </div>
                                            <p className="text-xs text-slate-400">You have full administrative privileges over all platform features and database configurations.</p>
                                            <button 
                                                onClick={() => { setIsAdminMode(false); setAdminPassword(''); }}
                                                className="bg-red-600/20 border border-red-600 text-red-400 hover:bg-red-600/30 font-medium px-4 py-2 rounded-lg text-sm transition"
                                            >
                                                Lock Admin Session
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="bg-slate-900 border-t border-slate-800 py-4 px-6 text-center text-xs text-slate-500">
                        ZR Film Draft AI Web Application • Hosted & Secured on Vercel
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
